version: '3.8'

services:
  # ========================================
  # WorkLab Backend API
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: worklab-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      BACKEND_PORT: 8000
      BACKEND_HOST: 0.0.0.0
      WORKLAB_DB_PATH: /var/lib/worklab/worklab.db
      # Load from .env file - add your variables there
    env_file:
      - ./backend/.env
    volumes:
      # Persistent database storage
      - worklab_data:/var/lib/worklab
      # Logs
      - worklab_logs:/var/log/worklab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - worklab-network

  # ========================================
  # Nginx Reverse Proxy (Optional)
  # ========================================
  # Uncomment if running both frontend and backend locally with Docker
  # nginx:
  #   image: nginx:latest
  #   container_name: worklab-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - worklab-network

volumes:
  worklab_data:
    driver: local
  worklab_logs:
    driver: local

networks:
  worklab-network:
    driver: bridge
